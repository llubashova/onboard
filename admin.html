<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель администратора | Auditorium Onboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-wrap{max-width:960px;margin:0 auto;padding:24px 16px}
    h2{color:#0a4d8c;margin:0 0 6px}
    .section-card{background:#fff;border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:0 4px 20px rgba(0,0,0,.07)}
    .section-card h3{color:#0a4d8c;margin:0 0 16px;font-size:1.05rem;border-bottom:2px solid #e8f0fe;padding-bottom:8px}
    .invite-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .invite-controls select,.invite-controls input{padding:9px 12px;border:2px solid #e8f0fe;border-radius:8px;font-size:.9rem;font-family:inherit;outline:none}
    .invite-controls select:focus,.invite-controls input:focus{border-color:#1a7fd4}
    .btn{padding:9px 18px;border:none;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer;transition:.15s}
    .btn-primary{background:linear-gradient(135deg,#0a4d8c,#1a7fd4);color:#fff}
    .btn-danger{background:#fff;color:#e74c3c;border:2px solid #e74c3c}
    .btn-warn{background:#fff3e0;color:#e65100;border:2px solid #ffb74d}
    .btn-sm{padding:5px 12px;font-size:.8rem}
    .invite-table,.user-table{width:100%;border-collapse:collapse;font-size:.87rem}
    .invite-table th,.user-table th{background:#f0f7ff;color:#0a4d8c;padding:9px 12px;text-align:left;font-weight:700}
    .invite-table td,.user-table td{padding:9px 12px;border-bottom:1px solid #eef2fb;vertical-align:middle}
    .invite-table tr:hover td,.user-table tr:hover td{background:#f8fbff}
    .code-pill{background:#e8f0fe;color:#0a4d8c;border-radius:6px;padding:3px 10px;font-family:monospace;font-weight:700;letter-spacing:.05em}
    .ubadge{display:inline-block;border-radius:20px;padding:2px 10px;font-size:.78rem;font-weight:700}
    .badge-used{background:#f3f4f6;color:#9ca3af}
    .badge-active{background:#d1fae5;color:#065f46}
    .badge-blocked{background:#fee2e2;color:#991b1b}
    .badge-hr{background:#dbeafe;color:#1e40af}
    .badge-prod{background:#fef9c3;color:#854d0e}
    .badge-sales{background:#f0fdf4;color:#166534}
    .badge-mkt{background:#fdf4ff;color:#7e22ce}
    .badge-ceo{background:#fce7f3;color:#9d174d}
    .badge-exec{background:#ede9fe;color:#5b21b6}
    .badge-ops{background:#ecfdf5;color:#065f46}
    .copy-btn{background:#f0f7ff;border:1px solid #c7d7f0;border-radius:6px;padding:3px 8px;font-size:.78rem;cursor:pointer;color:#0a4d8c}
    .copy-btn:hover{background:#dbeafe}
    .empty-row td{color:#aaa;text-align:center;padding:20px}
    .role-select{padding:4px 8px;border:1px solid #dde8f5;border-radius:6px;font-size:.82rem;font-family:inherit}
    .alert{background:#d1fae5;color:#065f46;border-radius:8px;padding:10px 16px;font-size:.88rem;margin-bottom:12px;display:none}
    /* Хедер: навигация */
    .header-nav{display:flex;align-items:center;gap:16px}
    .header-back{color:rgba(255,255,255,.85);font-size:.88rem;font-weight:500;text-decoration:none;padding:6px 14px;border:1px solid rgba(255,255,255,.3);border-radius:20px;transition:.2s;white-space:nowrap}
    .header-back:hover{background:rgba(255,255,255,.2);color:#fff}
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">🎓 Auditorium Onboard</div>
    <div class="header-nav">
      <span id="headerUser" style="color:rgba(255,255,255,.85);font-size:.9rem"></span>
      <a href="index.html" class="header-back">← Главная</a>
    </div>
  </div>
</header>

<div class="admin-wrap">
  <h2>🛠️ Панель администратора</h2>
  <p style="color:#888;margin:0 0 24px">Управление приглашениями и пользователями</p>
  <div class="alert" id="alertMsg"></div>

  <!-- ИНВАЙТЫ -->
  <div class="section-card">
    <h3>🔑 Коды приглашений</h3>
    <div class="invite-controls">
      <select id="newInviteRole">
        <optgroup label="— Сотрудники —">
          <option value="producer">🎬 Продюсер</option>
          <option value="sales">📞 Менеджер по продажам</option>
          <option value="marketing">📣 Специалист по маркетингу</option>
        </optgroup>
        <optgroup label="— Администраторы —">
          <option value="hr">👩‍💼 HR-менеджер</option>
          <option value="ceo">👑 Генеральный директор</option>
          <option value="exec_dir">🏢 Исполнительный директор</option>
          <option value="ops_dir">⚙️ Операционный директор</option>
        </optgroup>
      </select>
      <input type="text" id="newInviteLabel" placeholder="Пометка (имя кандидата)" style="flex:1;min-width:160px">
      <button class="btn btn-primary" onclick="createInvite()">+ Создать код</button>
    </div>
    <table class="invite-table">
      <thead><tr><th>Код</th><th>Роль</th><th>Пометка</th><th>Статус</th><th></th></tr></thead>
      <tbody id="inviteTableBody"></tbody>
    </table>
  </div>

  <!-- ПОЛЬЗОВАТЕЛИ -->
  <div class="section-card">
    <h3>👥 Пользователи системы</h3>
    <table class="user-table">
      <thead><tr><th>ФИО</th><th>Логин</th><th>Роль</th><th>Статус</th><th>Действия</th></tr></thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>
</div>

<script src="auth.js"></script>
<script>
const ROLE_NAMES = {
  producer:'Продюсер',
  sales:'Менеджер по продажам',
  marketing:'Специалист по маркетингу',
  hr:'HR-менеджер',
  ceo:'Генеральный директор',
  exec_dir:'Исполнительный директор',
  ops_dir:'Операционный директор'
};
const ROLE_BADGES = {
  producer:'badge-prod',
  sales:'badge-sales',
  marketing:'badge-mkt',
  hr:'badge-hr',
  ceo:'badge-ceo',
  exec_dir:'badge-exec',
  ops_dir:'badge-ops'
};

const ADMIN_ROLES = ['hr','ceo','exec_dir','ops_dir'];

function showAlert(msg) {
  const el = document.getElementById('alertMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

// ── Инвайты
function createInvite() {
  const role  = document.getElementById('newInviteRole').value;
  const label = document.getElementById('newInviteLabel').value.trim();
  const code  = Auth.createInvite(role, label);
  document.getElementById('newInviteLabel').value = '';
  renderInvites();
  showAlert('✅ Код создан: ' + code);
}

function renderInvites() {
  const tbody = document.getElementById('inviteTableBody');
  const inv   = Auth.getInvites();
  const codes = Object.keys(inv);
  if (!codes.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Нет кодов — создайте первый</td></tr>';
    return;
  }
  tbody.innerHTML = '';
  codes.sort((a,b) => (inv[a].used ? 1 : 0) - (inv[b].used ? 1 : 0)).forEach(code => {
    const c = inv[code];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="code-pill">${code}</span>
        <button class="copy-btn" onclick="copyCode('${code}')">копировать</button></td>
      <td><span class="ubadge ${ROLE_BADGES[c.role]||''}">${ROLE_NAMES[c.role]||c.role}</span></td>
      <td>${c.label||'—'}</td>
      <td>${c.used
        ? '<span class="ubadge badge-used">Использован</span>'
        : '<span class="ubadge badge-active">Активен</span>'}</td>
      <td>${c.used ? '' : `<button class="btn btn-danger btn-sm" onclick="delInvite('${code}')"> Удалить</button>`}</td>
    `;
    tbody.appendChild(tr);
  });
}

function copyCode(code) {
  navigator.clipboard.writeText(code).then(() => showAlert('📋 Скопировано: ' + code));
}
function delInvite(code) {
  if (!confirm('Удалить код ' + code + '?')) return;
  Auth.deleteInvite(code);
  renderInvites();
}

// ── Пользователи
function renderUsers() {
  const tbody   = document.getElementById('userTableBody');
  const users   = Auth.getUsers();
  const meLogin = Auth.currentLogin();
  const logins  = Object.keys(users);
  if (!logins.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Нет пользователей</td></tr>';
    return;
  }
  tbody.innerHTML = '';
  logins.sort((a,b) => users[a].fio.localeCompare(users[b].fio)).forEach(login => {
    const u  = users[login];
    const me = login === meLogin;
    const allRoles = ['producer','sales','marketing','hr','ceo','exec_dir','ops_dir'];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${u.fio}
        ${u.admin ? ' <span style="color:#0a4d8c;font-size:.75rem">★ admin</span>' : ''}
        ${me     ? ' <span style="color:#888;font-size:.75rem">(вы)</span>'     : ''}
      </td>
      <td style="font-family:monospace;font-size:.85rem">${login}</td>
      <td>
        <select class="role-select" onchange="changeRole('${login}',this.value)" ${me ? 'disabled' : ''}>
          ${allRoles.map(r => `<option value="${r}" ${u.role===r?'selected':''}>${ROLE_NAMES[r]}</option>`).join('')}
        </select>
      </td>
      <td>${u.blocked
        ? '<span class="ubadge badge-blocked">Заблокирован</span>'
        : '<span class="ubadge badge-active">Активен</span>'}</td>
      <td style="display:flex;gap:6px;flex-wrap:wrap">
        ${!me && !u.blocked ? `<button class="btn btn-warn btn-sm" onclick="blockUser('${login}')">  Блок</button>` : ''}
        ${!me &&  u.blocked ? `<button class="btn btn-primary btn-sm" onclick="unblockUser('${login}')">  Разблок</button>` : ''}
        ${!me && !u.admin   ? `<button class="btn btn-sm" style="background:#e0f2fe;color:#0369a1;border:1px solid #7dd3fc" onclick="promoteUser('${login}')">  → Admin</button>` : ''}
        ${!me ? `<button class="btn btn-danger btn-sm" onclick="deleteUser('${login}')">  Удалить</button>` : ''}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function changeRole(login, role) {
  Auth.setUserRole(login, role);
  // Если новая роль админская — проставляем admin:true
  if (ADMIN_ROLES.includes(role)) Auth.promoteToAdmin(login);
  showAlert('✅ Роль обновлена');
  renderUsers();
}
function blockUser(login) {
  if (!confirm('Заблокировать ' + login + '?')) return;
  Auth.blockUser(login); renderUsers(); showAlert('🔒 Заблокирован');
}
function unblockUser(login) {
  Auth.unblockUser(login); renderUsers(); showAlert('🔓 Разблокирован');
}
function promoteUser(login) {
  if (!confirm('Дать ' + login + ' права администратора?')) return;
  Auth.promoteToAdmin(login); renderUsers(); showAlert('⭐ Повышен до admin');
}
function deleteUser(login) {
  if (!confirm('Удалить пользователя ' + login + '? Это нельзя отменить!')) return;
  Auth.deleteUser(login); renderUsers(); showAlert('🗑️ Удалён');
}

window.onload = function() {
  if (!Auth.requireAuth()) return;
  if (!Auth.isAdmin()) { window.location.href = 'index.html'; return; }
  const u = Auth.current();
  document.getElementById('headerUser').textContent = u.fio + ' · ' + (ROLE_NAMES[u.role]||'');
  renderInvites();
  renderUsers();
};
</script>
</body>
</html>
