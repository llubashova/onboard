<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Квизы | Auditorium Onboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script>if(!localStorage.getItem('ao_session'))location.replace('login.html');</script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .page-head{margin-bottom:24px}
    .page-head h1{font-size:1.7rem;color:#0a4d8c;margin:0 0 6px}
    .page-head p{margin:0;color:#666}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:#1a7fd4;text-decoration:none;font-size:.9rem;font-weight:600;margin-bottom:18px}
    .back-link:hover{text-decoration:underline}
    .quiz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
    .quiz-card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(10,77,140,.08);border:1px solid #e8f0fe}
    .quiz-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
    .quiz-icon{width:48px;height:48px;border-radius:14px;background:#f0f7ff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
    .quiz-title{font-size:1rem;font-weight:700;color:#1a1a2e;margin:0 0 4px}
    .quiz-sub{font-size:.82rem;color:#777}
    .quiz-desc{font-size:.9rem;line-height:1.55;color:#444;margin:10px 0 14px}
    .quiz-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .quiz-badge{display:inline-block;border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700}
    .badge-general{background:#ede9fe;color:#5b21b6}
    .badge-producer{background:#fef3c7;color:#92400e}
    .badge-sales{background:#dcfce7;color:#166534}
    .badge-marketing{background:#fdf4ff;color:#a21caf}
    .quiz-btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:11px 14px;border:none;border-radius:12px;background:linear-gradient(135deg,#0a4d8c,#1a7fd4);color:#fff;font-size:.92rem;font-weight:700;cursor:pointer;text-decoration:none}
    .quiz-btn:hover{opacity:.92}
    .state-box{background:#fff;border-radius:18px;padding:26px;text-align:center;color:#777;box-shadow:0 4px 20px rgba(10,77,140,.06);border:1px solid #e8f0fe}
    .spinner{display:inline-block;width:22px;height:22px;border:3px solid #c7d7f0;border-top-color:#1a7fd4;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
    .question-card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 20px rgba(10,77,140,.08);border:1px solid #e8f0fe}
    .question-progress{font-size:.82rem;font-weight:700;color:#1a7fd4;margin-bottom:10px}
    .question-text{font-size:1.05rem;font-weight:700;color:#1a1a2e;line-height:1.4;margin-bottom:16px}
    .answers{display:grid;gap:10px}
    .answer-btn{width:100%;text-align:left;padding:14px 16px;border:2px solid #e8f0fe;border-radius:12px;background:#fff;cursor:pointer;font:inherit;color:#333;transition:.15s}
    .answer-btn:hover{border-color:#1a7fd4;background:#f8fbff}
    .answer-btn.selected{border-color:#1a7fd4;background:#eef6ff}
    .answer-btn.correct{border-color:#22c55e;background:#ecfdf5}
    .answer-btn.wrong{border-color:#ef4444;background:#fef2f2}
    .quiz-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
    .btn{padding:10px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font:inherit}
    .btn-primary{background:linear-gradient(135deg,#0a4d8c,#1a7fd4);color:#fff}
    .btn-secondary{background:#f3f4f6;color:#444}
    .result-box{background:#fff;border-radius:18px;padding:28px;text-align:center;box-shadow:0 4px 20px rgba(10,77,140,.08);border:1px solid #e8f0fe}
    .result-score{font-size:2rem;font-weight:800;color:#0a4d8c;margin-bottom:8px}
    .hidden{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo"><span class="logo-icon">🎓</span> Auditorium Onboard</div>
    <div class="user-badge" id="headerUserBadge" style="cursor:pointer">
      <span id="headerUser">—</span>
    </div>
  </div>
</header>

<div class="main-wrap">
  <a href="index.html" class="back-link">← Назад на главную</a>

  <div class="page-head" id="quizListHead">
    <h1>🧩 Квизы</h1>
    <p>Проверь знания по процессам, ролям и внутренним правилам команды</p>
  </div>

  <div id="quizListView">
    <div id="quizListContainer" class="state-box"><span class="spinner"></span>Загружаю квизы…</div>
  </div>

  <div id="quizRunView" class="hidden">
    <div class="question-card">
      <div class="question-progress" id="questionProgress"></div>
      <div class="question-text" id="questionText"></div>
      <div class="answers" id="answersBox"></div>
      <div class="quiz-actions">
        <button class="btn btn-secondary" onclick="backToList()">← К списку</button>
        <button class="btn btn-primary hidden" id="nextBtn" onclick="nextQuestion()">Дальше</button>
      </div>
    </div>
  </div>

  <div id="quizResultView" class="hidden">
    <div class="result-box">
      <div class="result-score" id="resultScore"></div>
      <p id="resultText" style="color:#555;margin:0 0 18px"></p>
      <div class="quiz-actions" style="justify-content:center">
        <button class="btn btn-secondary" onclick="backToList()">← К списку</button>
        <button class="btn btn-primary" onclick="restartQuiz()">Пройти заново</button>
      </div>
    </div>
  </div>
</div>

<footer><p>ООО «Аудиториум СиДжи» · Система геймификации адаптации · 2026</p></footer>

<script src="db.js"></script>
<script src="auth.js"></script>
<script>
const TQ_BIN_ID  = '6a0c18b56877513b27974e7e';
const TQ_API_KEY = '$2a$10$ztuK5lj5tKStjmGmDj8Pe.n.zb.iPHEiLM4Y6Zc6D.RbMWAejc.hC';
const TQ_URL     = `https://api.jsonbin.io/v3/b/${TQ_BIN_ID}`;

const CAT_LABELS = {
  general: '✨ Общие',
  producer: '🎬 Продюсеры',
  sales: '📞 Продажи',
  marketing: '📣 Маркетинг'
};

let quizzes = [];
let currentQuiz = null;
let currentQuestionIndex = 0;
let selectedAnswer = null;
let score = 0;

async function loadQuizzes() {
  try {
    const r = await fetch(TQ_URL, {
      headers: {
        'X-Master-Key': TQ_API_KEY,
        'X-Bin-Meta': 'false'
      }
    });
    const d = await r.json();
    quizzes = Array.isArray(d.quizzes) ? d.quizzes : [];
    renderQuizList();
  } catch (e) {
    document.getElementById('quizListContainer').className = 'state-box';
    document.getElementById('quizListContainer').innerHTML = 'Не удалось загрузить квизы 😢';
  }
}

function renderQuizList() {
  const box = document.getElementById('quizListContainer');
  if (!quizzes.length) {
    box.className = 'state-box';
    box.innerHTML = 'Пока нет опубликованных квизов. Добавь их через админку 🛠️';
    return;
  }

  box.className = 'quiz-grid';
  box.innerHTML = quizzes.map((q, idx) => {
    const cat = q.category || 'general';
    const questionsCount = Array.isArray(q.questions) ? q.questions.length : 0;
    return `
      <div class="quiz-card">
        <div class="quiz-top">
          <div class="quiz-icon">${q.icon || '🧩'}</div>
          <div>
            <div class="quiz-title">${q.title || 'Без названия'}</div>
            <div class="quiz-sub">Квиз #${idx + 1}</div>
          </div>
        </div>
        <div class="quiz-desc">Проверь знания по теме и закрепи материал в игровом формате.</div>
        <div class="quiz-meta">
          <span class="quiz-badge badge-${cat}">${CAT_LABELS[cat] || cat}</span>
          <span class="quiz-badge" style="background:#f3f4f6;color:#555">${questionsCount} вопросов</span>
        </div>
        <button class="quiz-btn" onclick="startQuiz(${idx})">Начать квиз</button>
      </div>`;
  }).join('');
}

function startQuiz(index) {
  currentQuiz = quizzes[index];
  if (!currentQuiz || !Array.isArray(currentQuiz.questions) || !currentQuiz.questions.length) return;
  currentQuestionIndex = 0;
  selectedAnswer = null;
  score = 0;

  document.getElementById('quizListView').classList.add('hidden');
  document.getElementById('quizListHead').classList.add('hidden');
  document.getElementById('quizResultView').classList.add('hidden');
  document.getElementById('quizRunView').classList.remove('hidden');

  renderQuestion();
}

function renderQuestion() {
  const q = currentQuiz.questions[currentQuestionIndex];
  selectedAnswer = null;
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('questionProgress').textContent = `Вопрос ${currentQuestionIndex + 1} из ${currentQuiz.questions.length}`;
  document.getElementById('questionText').textContent = q.question || 'Без текста вопроса';

  const answersBox = document.getElementById('answersBox');
  answersBox.innerHTML = '';

  (q.answers || []).forEach((answer, idx) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = answer.text || `Ответ ${idx + 1}`;
    btn.onclick = () => selectAnswer(idx);
    answersBox.appendChild(btn);
  });
}

function selectAnswer(index) {
  if (selectedAnswer !== null) return;
  selectedAnswer = index;

  const q = currentQuiz.questions[currentQuestionIndex];
  const buttons = [...document.querySelectorAll('.answer-btn')];
  buttons.forEach(b => b.disabled = true);

  buttons.forEach((b, i) => {
    if (i === index) b.classList.add('selected');
    if (q.answers[i] && q.answers[i].correct) b.classList.add('correct');
    if (i === index && !(q.answers[i] && q.answers[i].correct)) b.classList.add('wrong');
  });

  if (q.answers[index] && q.answers[index].correct) score++;
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('nextBtn').textContent =
    currentQuestionIndex === currentQuiz.questions.length - 1 ? 'Показать результат' : 'Дальше';
}

function nextQuestion() {
  if (currentQuestionIndex < currentQuiz.questions.length - 1) {
    currentQuestionIndex++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quizRunView').classList.add('hidden');
  document.getElementById('quizResultView').classList.remove('hidden');
  document.getElementById('resultScore').textContent = `${score} / ${currentQuiz.questions.length}`;
  const percent = Math.round((score / currentQuiz.questions.length) * 100);
  document.getElementById('resultText').textContent =
    percent === 100 ? 'Идеально! Ты отлично знаешь материал 💯' :
    percent >= 70 ? 'Очень хорошо! Материал уже уверенно усваивается 🙌' :
    percent >= 40 ? 'Неплохо, но стоит ещё раз пройти материалы 📚' :
    'Ничего страшного — попробуй ещё раз после изучения базы знаний ✨';
}

function restartQuiz() {
  if (!currentQuiz) return;
  currentQuestionIndex = 0;
  selectedAnswer = null;
  score = 0;
  document.getElementById('quizResultView').classList.add('hidden');
  document.getElementById('quizRunView').classList.remove('hidden');
  renderQuestion();
}

function backToList() {
  document.getElementById('quizRunView').classList.add('hidden');
  document.getElementById('quizResultView').classList.add('hidden');
  document.getElementById('quizListView').classList.remove('hidden');
  document.getElementById('quizListHead').classList.remove('hidden');
  currentQuiz = null;
}

window.onload = function () {
  if (!Auth.requireAuth()) return;
  DB.ready.then(() => {
    const u = Auth.current();
    if (u) document.getElementById('headerUser').textContent = u.fio.split(' ')[0];
    loadQuizzes();
  });
};
</script>
</body>
</html>
