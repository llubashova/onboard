<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Индивидуальный маршрут</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>if(!localStorage.getItem('ao_session'))location.replace('login.html');</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="game.css?v=3">
  <style>
    .cr-hero{background:linear-gradient(135deg,#0a4d8c,#1a7fd4);border-radius:20px;padding:28px 32px;color:#fff;margin-bottom:20px}
    .cr-hero h1{margin:0 0 6px;font-size:1.6rem}
    .cr-hero p{margin:0;opacity:.85;font-size:.95rem}

    /* XP-панель — точная копия producer.html */
    .xp-panel{background:#fff;border-radius:14px;padding:16px 20px;margin-bottom:24px;box-shadow:0 2px 12px rgba(10,77,140,.1);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .xp-level-badge{font-size:1.3rem;font-weight:800;color:#0a4d8c;min-width:160px}
    .xp-bar-wrap{flex:1;min-width:180px}
    .xp-bar-label{font-size:.8rem;color:#888;margin-bottom:4px;display:flex;justify-content:space-between}
    .xp-bar{height:12px;background:#e8f3ff;border-radius:6px;overflow:hidden}
    .xp-bar-fill{height:100%;background:linear-gradient(90deg,#1a7fd4,#27ae60);border-radius:6px;transition:.4s}

    .cr-level{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:20px;overflow:hidden}
    .cr-level-head{background:#f0f7ff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dde8f5}
    .cr-level-head h2{margin:0;font-size:1rem;color:#0a4d8c}
    .cr-level-head .cr-lv-prog{font-size:.82rem;color:#1a7fd4;font-weight:600}
    .cr-task-list{padding:12px 22px 16px}
    .cr-task-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f4fa}
    .cr-task-item:last-child{border-bottom:none}
    .cr-task-item input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:#1a7fd4;flex-shrink:0}
    .cr-task-name{flex:1;font-size:.93rem;color:#222}
    .cr-task-name.done{text-decoration:line-through;color:#aaa}
    .cr-task-xp{font-size:.78rem;background:#e8f3ff;color:#0a4d8c;border-radius:20px;padding:2px 8px;font-weight:700;white-space:nowrap}
    .cr-task-xp.earned{background:#d1fae5;color:#065f46}
    .cr-empty{text-align:center;padding:60px 20px;color:#aaa}
    .back-btn{display:inline-flex;align-items:center;gap:6px;color:#1a7fd4;font-weight:600;text-decoration:none;font-size:.9rem;margin-bottom:20px;background:#e8f3ff;border-radius:10px;padding:8px 14px;transition:.15s}
    .back-btn:hover{background:#d0e8ff}
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none"><span class="logo-icon">🎓</span> Auditorium Onboard</a></div>
    <div class="user-badge" id="headerUserBadge" style="cursor:default">
      <span id="headerUser">—</span>
    </div>
  </div>
</header>

<div class="main-wrap">
  <a href="index.html" class="back-btn">← Назад на главную</a>

  <div id="crHero" style="display:none">
    <div class="cr-hero">
      <h1 id="crHeroTitle">🎯 Индивидуальный маршрут</h1>
      <p id="crHeroSub">Твой персональный план адаптации</p>
    </div>
    <!-- XP-панель -->
    <div class="xp-panel">
      <div class="xp-level-badge" id="xpLevelBadge">🌱 Новичок</div>
      <div class="xp-bar-wrap">
        <div class="xp-bar-label">
          <span id="xpCounter">0 / 0 XP</span>
          <span id="xpPct">0%</span>
        </div>
        <div class="xp-bar"><div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <div id="pageContent"><div class="cr-empty">⏳ Загрузка маршрута…</div></div>
</div>

<footer><p>ООО «Аудиториум СиДжи» · Система геймификации адаптации · 2026</p></footer>

<script src="db.js"></script>
<script src="auth.js"></script>
<script src="game.js?v=3"></script>
<script>
const TQ_BIN_ID  = '6a0c18b56877513b27974e7e';
const TQ_API_KEY = '$2a$10$ztuK5lj5tKStjmGmDj8Pe.n.zb.iPHEiLM4Y6Zc6D.RbMWAejc.hC';
const TQ_URL     = `https://api.jsonbin.io/v3/b/${TQ_BIN_ID}`;

// XP по ролевым маршрутам (для суммарного XP)
const ROLE_TASK_XP = {
  producer_l1_p1:10,producer_l1_p2:10,producer_l1_p3:10,producer_l1_p4:10,
  producer_l1_m1:8,producer_l1_m2:8,
  producer_l1_s1:5,producer_l1_s2:5,producer_l1_s3:5,
  producer_l2_p1:15,producer_l2_p2:15,producer_l2_p3:15,producer_l2_p4:15,producer_l2_p5:15,
  producer_l2_m1:8,producer_l2_m2:8,
  producer_l2_s1:5,producer_l2_s2:5,
  producer_l3_p1:25,producer_l3_p2:25,producer_l3_p3:25,producer_l3_p4:25,
  producer_l3_m1:8,producer_l3_s1:5,producer_l3_s2:5,
  sales_l1_p1:10,sales_l1_p2:10,sales_l1_p3:10,sales_l1_p4:10,
  sales_l1_m1:8,sales_l1_m2:8,
  sales_l1_s1:5,sales_l1_s2:5,sales_l1_s3:5,
  sales_l2_p1:15,sales_l2_p2:15,sales_l2_p3:15,sales_l2_p4:15,sales_l2_p5:15,
  sales_l2_m1:8,sales_l2_m2:8,
  sales_l2_s1:5,sales_l2_s2:5,
  sales_l3_p1:25,sales_l3_p2:25,sales_l3_p3:25,sales_l3_p4:25,
  sales_l3_m1:8,sales_l3_s1:5,sales_l3_s2:5,
  marketing_l1_p1:10,marketing_l1_p2:10,marketing_l1_p3:10,marketing_l1_p4:10,
  marketing_l1_m1:8,marketing_l1_m2:8,
  marketing_l1_s1:5,marketing_l1_s2:5,marketing_l1_s3:5,
  marketing_l2_p1:15,marketing_l2_p2:15,marketing_l2_p3:15,marketing_l2_p4:15,marketing_l2_p5:15,
  marketing_l2_m1:8,marketing_l2_m2:8,
  marketing_l2_s1:5,marketing_l2_s2:5,
  marketing_l3_p1:25,marketing_l3_p2:25,marketing_l3_p3:25,marketing_l3_p4:25,
  marketing_l3_m1:8,marketing_l3_s1:5,marketing_l3_s2:5
};
const ROLE_MAX_XP = { producer:290, sales:290, marketing:290 };

let _route = null;
let _login = null;
let _userRole = null;

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function crKey(routeId, li, ti) { return `ao_cr_${routeId}_${li}_${ti}`; }

// Считаем XP только по кастомному маршруту
function calcCRProgress(routeId, levels) {
  let done=0, total=0, xpEarned=0, xpTotal=0;
  (levels||[]).forEach((lv,li)=>{
    (lv.tasks||[]).forEach((t,ti)=>{
      total++; xpTotal+=(t.xp||0);
      if(localStorage.getItem(crKey(routeId,li,ti))==='1'){done++;xpEarned+=(t.xp||0);}
    });
  });
  return {done,total,xpEarned,xpTotal,pct:total?Math.round(done/total*100):0};
}

// XP по ролевому маршруту текущего пользователя
function calcRoleXp(login, role) {
  const keys = Object.keys(ROLE_TASK_XP).filter(k=>k.startsWith(role+'_'));
  let xp=0;
  keys.forEach(k=>{ if(Auth.getCheckForUser(login,k)) xp+=ROLE_TASK_XP[k]; });
  return { xp, maxXp: ROLE_MAX_XP[role]||290 };
}

// Суммарный XP (роль + кастомный) — основа для уровней и бейджей
function calcTotalXp() {
  if(!_route) return {totalXp:0,maxXp:0};
  const base = _userRole ? calcRoleXp(_login,_userRole) : {xp:0,maxXp:0};
  const cr   = calcCRProgress(_route.id,_route.levels);
  return {totalXp: base.xp+cr.xpEarned, maxXp: base.maxXp+cr.xpTotal};
}

// Уровень — как у producer.html, но от суммарного XP
// Пороги: 24% → Продвинутый, 60% → Профи (те же что в game.js trackLevelUp)
function getXpLevel(totalXp, maxXp) {
  const pct = maxXp ? Math.round(totalXp/maxXp*100) : 0;
  if(pct>=60) return '🏆 Профи';
  if(pct>=24) return '🚀 Продвинутый';
  return '🌱 Новичок';
}

function updateXpPanel(animated, prevXp) {
  const {totalXp,maxXp} = calcTotalXp();
  const pct = maxXp ? Math.round(totalXp/maxXp*100) : 0;
  document.getElementById('xpLevelBadge').textContent = getXpLevel(totalXp,maxXp);
  const counter = document.getElementById('xpCounter');
  if(animated && prevXp!==undefined){
    animateCounter(counter, prevXp, totalXp, ' / '+maxXp+' XP');
  } else {
    counter.textContent = totalXp+' / '+maxXp+' XP';
  }
  document.getElementById('xpPct').textContent = pct+'%';
  document.getElementById('xpBarFill').style.width = pct+'%';
}

function saveTaskCheck(routeId, li, ti, checked, taskXp) {
  const key = crKey(routeId,li,ti);
  if(checked) localStorage.setItem(key,'1');
  else localStorage.removeItem(key);

  if(checked){
    const prevTotalXp = calcTotalXp().totalXp - taskXp;
    updateXpPanel(true, prevTotalXp);
    const {totalXp,maxXp} = calcTotalXp();
    // taskKey = элемент с id для попапа — используем синтетический id
    const syntheticId = `cr_${li}_${ti}`;
    Game.onTaskComplete(syntheticId, taskXp, totalXp, maxXp, getXpLevel(totalXp,maxXp));
  } else {
    updateXpPanel();
  }

  renderLevels();
}

function renderLevels() {
  const r = _route;
  if(!r) return;
  let html = '';
  (r.levels||[]).forEach((lv,li)=>{
    const tasks = lv.tasks||[];
    const lvDone = tasks.filter((_,ti)=>localStorage.getItem(crKey(r.id,li,ti))==='1').length;
    const lvXp   = tasks.reduce((s,t,ti)=>s+(localStorage.getItem(crKey(r.id,li,ti))==='1'?(t.xp||0):0),0);
    const lvMax  = tasks.reduce((s,t)=>s+(t.xp||0),0);
    const lvPct  = lvMax?Math.round(lvXp/lvMax*100):0;
    html+=`
      <div class="cr-level">
        <div class="cr-level-head">
          <h2>📌 ${esc(lv.title||('Уровень '+(li+1)))}</h2>
          <span class="cr-lv-prog">${lvDone}/${tasks.length} · ${lvPct}%</span>
        </div>
        <div class="cr-task-list">
          ${tasks.map((t,ti)=>{
            const checked = localStorage.getItem(crKey(r.id,li,ti))==='1';
            // синтетический id для попапа XP
            const synId = `cr_${li}_${ti}`;
            return `<div class="cr-task-item">
              <input type="checkbox" id="${synId}" ${checked?'checked':''}
                onchange="saveTaskCheck('${esc(r.id)}',${li},${ti},this.checked,${t.xp||0})">
              <label for="${synId}" class="cr-task-name ${checked?'done':''}">${esc(t.name)}</label>
              <span class="cr-task-xp ${checked?'earned':''}">+${t.xp||0} XP</span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  });
  document.getElementById('pageContent').innerHTML = html || '<div class="cr-empty">Задачи не добавлены</div>';
}

async function init() {
  if(!Auth.requireAuth()) return;
  const u = Auth.current();
  const login = Auth.currentLogin();
  _login = login;
  _userRole = u ? u.role : null;
  document.getElementById('headerUser').textContent = u ? u.fio.split(' ')[0] : '—';

  try {
    const resp = await fetch(TQ_URL,{cache:'no-cache',headers:{'X-Master-Key':TQ_API_KEY,'X-Bin-Meta':'false'}});
    const d = await resp.json();
    const users = Auth.getUsers();
    const me = users[login];
    const routeId = me&&me.customRouteId;
    if(routeId&&Array.isArray(d.customRoutes)){
      _route = d.customRoutes.find(r=>r.id===routeId)||null;
    }
  } catch(e){}

  if(!_route){
    document.getElementById('pageContent').innerHTML='<div class="cr-empty">😔 Индивидуальный маршрут не найден или не назначен</div>';
    return;
  }

  document.title = _route.title+' — Auditorium Onboard';
  document.getElementById('crHeroTitle').textContent = (_route.icon||'🎯')+' '+_route.title;
  document.getElementById('crHeroSub').textContent   = _route.subtitle||'Твой персональный план адаптации';
  document.getElementById('crHero').style.display = 'block';

  updateXpPanel();
  renderLevels();

  // инициализируем level-трекер и welcome — как producer.html
  const {totalXp,maxXp} = calcTotalXp();
  Game.onPageLoad(totalXp, maxXp, u?u.fio.split(' ')[0]:'Сотрудник', _route.title||'Индивидуальный маршрут');
}

DB.ready.then(init);
</script>
</body>
</html>
