<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | Auditorium Onboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a4d8c,#1a7fd4)}
    .auth-card{background:#fff;border-radius:24px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .auth-logo{text-align:center;font-size:2.2rem;margin-bottom:8px}
    .auth-title{text-align:center;font-size:1.4rem;font-weight:700;color:#0a4d8c;margin-bottom:4px}
    .auth-sub{text-align:center;color:#888;font-size:.9rem;margin-bottom:28px}
    .tabs{display:flex;gap:0;margin-bottom:24px;border-radius:10px;overflow:hidden;border:2px solid #e8f0fe}
    .tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-weight:600;font-size:.92rem;background:#f7fafd;color:#888;transition:.2s}
    .tab.active{background:#0a4d8c;color:#fff}
    .auth-input{width:100%;box-sizing:border-box;padding:13px 16px;border:2px solid #e8f0fe;border-radius:10px;font-size:1rem;font-family:inherit;margin-bottom:12px;outline:none;transition:.2s}
    .auth-input:focus{border-color:#1a7fd4}
    .auth-btn{width:100%;padding:14px;background:linear-gradient(135deg,#0a4d8c,#1a7fd4);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;margin-top:4px}
    .auth-btn:hover{opacity:.9}
    .auth-msg{font-size:.87rem;text-align:center;min-height:20px;margin-bottom:8px;font-weight:500}
    #regForm{display:none}
    .sync-hint{text-align:center;font-size:.78rem;color:#aaa;margin-top:12px}
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">🎓</div>
    <div class="auth-title">Auditorium Onboard</div>
    <div class="auth-sub">Система адаптации персонала</div>
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">Вход</div>
      <div class="tab" id="tabReg"   onclick="switchTab('reg')">Регистрация</div>
    </div>
    <div id="loginForm">
      <input class="auth-input" type="text"     id="loginLogin" placeholder="Логин">
      <input class="auth-input" type="password" id="loginPass"  placeholder="Пароль">
      <div class="auth-msg" id="loginMsg"></div>
      <button class="auth-btn" onclick="doLogin()">Войти</button>
    </div>
    <div id="regForm">
      <input class="auth-input" type="text"     id="regFio"    placeholder="ФИО (полностью)">
      <input class="auth-input" type="text"     id="regLogin"  placeholder="Логин">
      <input class="auth-input" type="password" id="regPass"   placeholder="Пароль (мин. 4 символа)">
      <input class="auth-input" type="text"     id="regInvite" placeholder="Код приглашения (AO-XXXXXX)">
      <div class="auth-msg" id="regMsg"></div>
      <button class="auth-btn" onclick="doRegister()">Зарегистрироваться</button>
    </div>
    <div class="sync-hint" id="syncHint">🔄 Синхронизация с сервером…</div>
  </div>
</div>

<script src="db.js"></script>
<script src="auth.js"></script>
<script>
function switchTab(t) {
  document.getElementById('loginForm').style.display = t==='login' ? 'block' : 'none';
  document.getElementById('regForm').style.display   = t==='reg'   ? 'block' : 'none';
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabReg').classList.toggle('active',   t==='reg');
}

function doLogin() {
  const login = document.getElementById('loginLogin').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const msg   = document.getElementById('loginMsg');
  const res   = Auth.login(login, pass);
  if (res.ok) { window.location.href = 'index.html'; }
  else { msg.style.color='#e74c3c'; msg.textContent=res.msg; }
}

function doRegister() {
  const fio    = document.getElementById('regFio').value.trim();
  const login  = document.getElementById('regLogin').value.trim();
  const pass   = document.getElementById('regPass').value;
  const invite = document.getElementById('regInvite').value.trim();
  const msg    = document.getElementById('regMsg');
  const users  = Auth.getUsers();
  if (Object.keys(users).length === 0) {
    const res = Auth.bootstrapAdmin(login, pass, fio);
    if (res.ok) { DB.sync(); Auth.login(login, pass); window.location.href='index.html'; }
    else { msg.style.color='#e74c3c'; msg.textContent=res.msg; }
    return;
  }
  const res = Auth.register(login, pass, fio, invite);
  if (res.ok) { DB.sync(); Auth.login(login, pass); window.location.href='index.html'; }
  else { msg.style.color='#e74c3c'; msg.textContent=res.msg; }
}

// Форма доступна сразу. db.js уже запустил bgSync() в фоне.
// Ждём завершения синхронизации — прячем подсказку, проверяем сессию.
const _startTime = Date.now();
(function waitSync() {
  // Проверяем каждые 300мс, пришли ли данные (или прошло 6 сек)
  const elapsed = Date.now() - _startTime;
  const users = Auth.getUsers();
  if (Object.keys(users).length > 0 || elapsed > 6000) {
    document.getElementById('syncHint').style.display = 'none';
    if (Auth.current()) { window.location.href='index.html'; return; }
    if (Object.keys(Auth.getUsers()).length === 0) switchTab('reg');
  } else {
    setTimeout(waitSync, 300);
  }
})();
</script>
</body>
</html>
